# Integration-test profile. The datasource is supplied by Testcontainers at runtime.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

juriscore:
  security:
    jwt:
      secret: dGVzdC1vbmx5LXNlY3JldC1mb3ItanVyaXNjb3JlLWludGVncmF0aW9uLXRlc3Rz
      access-token-ttl: 5m
      refresh-token-ttl: 1d
    auth:
      max-failed-attempts: 3
  # Redis and AWS are not part of what these tests assert, and a test that needs three
  # containers to check a sign-in is a test people stop running.
  rate-limit:
    enabled: false
  # The reminder sweep is driven directly by ReminderDispatchServiceIT rather than by the
  # timer. A background thread mutating reminder rows while a test asserts on them is the
  # classic test that is green locally and red on a busy runner.
  reminders:
    enabled: false
  # aws.enabled=false selects InMemoryObjectStorageService, so the document rules are
  # exercised for real against a stand-in that stores no bytes. Nothing here needs AWS
  # credentials, LocalStack, or a network.
  aws:
    enabled: false
  # The overdue sweep is driven directly by OverdueInvoiceIT rather than by the timer, for
  # the same reason the reminder sweep is: a background thread mutating invoice rows while
  # a test asserts on them is the classic test that is green locally and red on a busy
  # runner.
  billing:
    overdue-sweep-enabled: false

logging:
  level:
    root: WARN
    com.juriscore: INFO
    org.testcontainers: WARN
