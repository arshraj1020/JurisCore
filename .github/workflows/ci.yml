name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # Caches ~/.m2 keyed on the pom files.
          cache: maven

      # `verify` runs unit tests (surefire), then integration tests (failsafe), then
      # packages. The IT suite starts its own PostgreSQL through Testcontainers on the
      # Docker daemon the runner already provides, so no service container is needed.
      - name: Build, test and package
        run: mvn -B -ntp verify

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: juriscore-jar
          path: juriscore-app/target/juriscore.jar
          retention-days: 7

  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Loaded into the local daemon so the scanner can read it; pushing to ECR
          # belongs in the deploy workflow, not here.
          load: true
          push: false
          tags: juriscore:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: juriscore:${{ github.sha }}
          format: table
          # Fail the build on fixable high and critical findings only — unfixable
          # base-image CVEs would otherwise block every merge with no action to take.
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory only: a CVE published overnight should not block an unrelated fix.
    continue-on-error: true
    # The NVD API has been rate-limited to the point of uselessness without a key —
    # an unkeyed run spends 20+ minutes downloading and then fails. Skipping cleanly
    # when the secret is absent beats a job that is red on every build and therefore
    # ignored on the build where it matters. Get a free key at
    # https://nvd.nist.gov/developers/request-an-api-key and add it as NVD_API_KEY.
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Check for an NVD API key
        id: nvd
        run: echo "present=${{ secrets.NVD_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Cache the NVD database
        if: steps.nvd.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: OWASP dependency check
        if: steps.nvd.outputs.present == 'true'
        run: >
          mvn -B -ntp org.owasp:dependency-check-maven:10.0.4:check
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
          -DfailBuildOnCVSS=8
          -DskipProvidedScope=true

      - name: Report skip
        if: steps.nvd.outputs.present != 'true'
        run: |
          echo "::notice title=Dependency audit skipped::Set the NVD_API_KEY secret to enable it."
